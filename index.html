<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda AliClin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f8;
      color: #263238;
    }

    header {
      background: white;
      padding: 20px 28px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 { margin: 0; }
    header p { margin: 4px 0 0; color: #607d8b; }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
      background: #477f86;
      color: white;
    }

    button.secondary {
      background: white;
      color: #37474f;
      border: 1px solid #cfd8dc;
    }

    main { padding: 20px 28px; }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #cfd8dc;
      border-radius: 6px;
      font: inherit;
      background: white;
    }

    .toolbar input,
    .toolbar select {
      width: auto;
    }

    .grid {
      background: white;
      border: 1px solid #ddd;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      border: 1px solid #e1e5e7;
      padding: 9px;
      text-align: center;
      height: 52px;
    }

    th { background: #fafafa; }

    th:first-child,
    td:first-child {
      width: 90px;
    }

    td.time {
      font-weight: bold;
      background: #fafafa;
    }

    td.cell { cursor: pointer; }

    td.cell:hover { background: #eef7f8; }

    .empty {
      color: #90a4ae;
      font-size: 13px;
    }

    .appointment {
      background: #d9f0f2;
      border-radius: 6px;
      padding: 6px;
      text-align: left;
      font-size: 13px;
    }

    .appointment strong {
      display: block;
      margin-bottom: 3px;
    }

    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal {
      background: white;
      width: 100%;
      max-width: 560px;
      border-radius: 12px;
      padding: 22px;
      max-height: 95vh;
      overflow-y: auto;
    }

    .modal h2 { margin-top: 0; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-size: 14px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .danger { background: #b94a48; }

    #message {
      margin-bottom: 12px;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      main, header { padding: 15px; }
      .row { grid-template-columns: 1fr; }
      table { min-width: 720px; }
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>AliClin</h1>
    <p>Agenda compartilhada da clínica</p>
  </div>

  <button onclick="openNew()">+ Novo agendamento</button>
</header>

<main>
  <div id="message"></div>

  <div class="toolbar">
    <button class="secondary" onclick="changeDay(-1)">← Dia anterior</button>
    <button class="secondary" onclick="goToday()">Hoje</button>
    <button class="secondary" onclick="changeDay(1)">Dia seguinte →</button>

    <input id="datePicker" type="date" onchange="loadAppointments()">

    <select id="filterRoom" onchange="render()">
      <option value="">Todas as salas</option>
      <option value="Consultório 1">Consultório 1</option>
      <option value="Consultório 2">Consultório 2</option>
      <option value="Consultório 3">Consultório 3</option>
    </select>
  </div>

  <div class="grid">
    <table>
      <thead>
        <tr>
          <th>Horário</th>
          <th>Consultório 1</th>
          <th>Consultório 2</th>
          <th>Consultório 3</th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">Novo agendamento</h2>

    <label>Paciente *</label>
    <input id="patient" type="text">

    <div class="row">
      <div>
        <label>Telefone</label>
        <input id="phone" type="text">
      </div>

      <div>
        <label>Profissional</label>
        <input id="professional" type="text">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Consultório *</label>
        <select id="room">
          <option value="Consultório 1">Consultório 1</option>
          <option value="Consultório 2">Consultório 2</option>
          <option value="Consultório 3">Consultório 3</option>
        </select>
      </div>

      <div>
        <label>Data *</label>
        <input id="appointmentDate" type="date">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Início *</label>
        <input id="start" type="time" step="1800">
      </div>

      <div>
        <label>Fim *</label>
        <input id="end" type="time" step="1800">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Status</label>
        <select id="status">
          <option value="Agendado">Agendado</option>
          <option value="Confirmado">Confirmado</option>
          <option value="Atendido">Atendido</option>
          <option value="Cancelado">Cancelado</option>
          <option value="Faltou">Faltou</option>
        </select>
      </div>

      <div>
        <label>Tipo de atendimento</label>
        <input id="type" type="text">
      </div>
    </div>

    <label>Observações</label>
    <textarea id="notes"></textarea>

    <div class="actions">
      <button
        id="deleteBtn"
        class="danger"
        style="display:none; margin-right:auto"
        onclick="deleteAppointment()">
        Excluir
      </button>

      <button class="secondary" onclick="closeModal()">Cancelar</button>
      <button onclick="saveAppointment()">Salvar</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://hxgkiebshwmtnwrdkmhb.supabase.co";

  /*
    COLE A SUA CHAVE PÚBLICA DO SUPABASE ABAIXO.
    Use somente a chave publishable/anon.
  */
  const SUPABASE_KEY = "sb_publishable_q6jVJbTlU1qS9xltrSoCpA_shgky4Cn";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const rooms = [
    "Consultório 1",
    "Consultório 2",
    "Consultório 3"
  ];

  let appointments = [];
  let editingId = null;

  function pad(number) {
    return String(number).padStart(2, "0");
  }

  function today() {
    const d = new Date();
    return (
      d.getFullYear() +
      "-" +
      pad(d.getMonth() + 1) +
      "-" +
      pad(d.getDate())
    );
  }

  function times() {
    const result = [];

    for (let hour = 8; hour <= 19; hour++) {
      result.push(pad(hour) + ":00");

      if (hour < 19) {
        result.push(pad(hour) + ":30");
      }
    }

    return result;
  }

  function normalizeTime(value) {
    if (!value) return "";
    return String(value).substring(0, 5);
  }

  function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value || "";
    return div.innerHTML;
  }

  function showMessage(text, error) {
    const el = document.getElementById("message");
    el.textContent = text || "";
    el.style.color = error ? "#b94a48" : "#2e7d32";
  }

  async function loadAppointments() {
    const date = document.getElementById("datePicker").value || today();
    document.getElementById("datePicker").value = date;

    showMessage("Carregando agenda...", false);

    const result = await supabaseClient
      .from("agendamentos")
      .select("*")
      .eq("data", date)
      .order("horario_inicial", { ascending: true });

    if (result.error) {
      appointments = [];
      showMessage(
        "Erro ao carregar: " + result.error.message,
        true
      );
      render();
      return;
    }

    appointments = result.data || [];
    showMessage("", false);
    render();
  }

  function render() {
    const body = document.getElementById("body");
    const selectedRoom = document.getElementById("filterRoom").value;

    body.innerHTML = "";

    times().forEach(function(time) {
      const tr = document.createElement("tr");

      const timeCell = document.createElement("td");
      timeCell.className = "time";
      timeCell.textContent = time;
      tr.appendChild(timeCell);

      rooms.forEach(function(room) {
        const cell = document.createElement("td");
        cell.className = "cell";

        if (selectedRoom && selectedRoom !== room) {
          cell.style.opacity = "0.25";
          tr.appendChild(cell);
          return;
        }

        const appointment = appointments.find(function(item) {
          const start = normalizeTime(item.horario_inicial);
          const end = normalizeTime(item.horario_final);

          return (
            item.sala === room &&
            start <= time &&
            end > time &&
            item.status !== "Cancelado"
          );
        });

        if (appointment) {
          cell.innerHTML =
            '<div class="appointment">' +
            "<strong>" +
            escapeHtml(appointment.paciente) +
            "</strong>" +
            escapeHtml(appointment.profissional || "") +
            "<br>" +
            normalizeTime(appointment.horario_inicial) +
            " - " +
            normalizeTime(appointment.horario_final) +
            "</div>";

          cell.onclick = function() {
            openExisting(appointment);
          };
        } else {
          cell.innerHTML = '<div class="empty">Livre</div>';

          cell.onclick = function() {
            openNew(
              document.getElementById("datePicker").value,
              room,
              time
            );
          };
        }

        tr.appendChild(cell);
      });

      body.appendChild(tr);
    });
  }

  function clearForm() {
    document.getElementById("patient").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("professional").value = "";
    document.getElementById("room").value = "Consultório 1";
    document.getElementById("appointmentDate").value = today();
    document.getElementById("start").value = "";
    document.getElementById("end").value = "";
    document.getElementById("status").value = "Agendado";
    document.getElementById("type").value = "";
    document.getElementById("notes").value = "";
  }

  function openNew(date, room, start) {
    editingId = null;
    clearForm();

    document.getElementById("modalTitle").textContent =
      "Novo agendamento";

    document.getElementById("deleteBtn").style.display = "none";

    document.getElementById("appointmentDate").value =
      date || document.getElementById("datePicker").value || today();

    if (room) {
      document.getElementById("room").value = room;
    }

    if (start) {
      document.getElementById("start").value = start;

      const parts = start.split(":");
      let hour = Number(parts[0]);
      let minute = Number(parts[1]) + 30;

      if (minute >= 60) {
        hour += 1;
        minute -= 60;
      }

      document.getElementById("end").value =
        pad(hour) + ":" + pad(minute);
    }

    document.getElementById("modalBg").style.display = "flex";
  }

  function openExisting(item) {
    editingId = item.id;

    document.getElementById("modalTitle").textContent =
      "Editar agendamento";

    document.getElementById("patient").value = item.paciente || "";
    document.getElementById("phone").value = item.telefone || "";
    document.getElementById("professional").value =
      item.profissional || "";
    document.getElementById("room").value =
      item.sala || "Consultório 1";
    document.getElementById("appointmentDate").value =
      item.dados || "";
    document.getElementById("start").value =
      normalizeTime(item.horario_inicial);
    document.getElementById("end").value =
      normalizeTime(item.horario_final);
    document.getElementById("status").value =
      item.status || "Agendado";
    document.getElementById("type").value =
      item.tipo_atendimento || "";
    document.getElementById("notes").value =
      item.observacao || "";

    document.getElementById("deleteBtn").style.display = "block";
    document.getElementById("modalBg").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("modalBg").style.display = "none";
  }

  async function saveAppointment() {
    const patient =
      document.getElementById("patient").value.trim();
    const phone =
      document.getElementById("phone").value.trim();
    const professional =
      document.getElementById("professional").value.trim();
    const room =
      document.getElementById("room").value;
    const date =
      document.getElementById("appointmentDate").value;
    const start =
      document.getElementById("start").value;
    const end =
      document.getElementById("end").value;
    const status =
      document.getElementById("status").value;
    const type =
      document.getElementById("type").value.trim();
    const notes =
      document.getElementById("notes").value.trim();

    if (!patient || !room || !date || !start || !end) {
      alert(
        "Preencha paciente, consultório, data, horário inicial e horário final."
      );
      return;
    }

    if (end <= start) {
      alert("O horário final deve ser depois do horário inicial.");
      return;
    }

    const conflict = appointments.some(function(item) {
      if (editingId && String(item.id) === String(editingId)) {
        return false;
      }

      return (
        item.sala === room &&
        item.status !== "Cancelado" &&
        normalizeTime(item.horario_inicial) < end &&
        normalizeTime(item.horario_final) > start
      );
    });

    if (conflict) {
      alert("Já existe um agendamento nesse consultório nesse horário.");
      return;
    }

    const payload = {
      paciente: patient,
      telefone: phone,
      profissional: professional,
      sala: room,
      dados: date,
      horario_inicial: start,
      horario_final: end,
      status: status,
      tipo_atendimento: type,
      observacao: notes
    };

    let result;

    if (editingId) {
      result = await supabaseClient
        .from("agendamentos")
        .update(payload)
        .eq("id", editingId)
        .select();
    } else {
      result = await supabaseClient
        .from("agendamentos")
        .insert([payload])
        .select();
    }

    if (result.error) {
      alert("Erro ao salvar: " + result.error.message);
      return;
    }

    document.getElementById("datePicker").value = date;

    closeModal();
    await loadAppointments();

    alert("Agendamento salvo com sucesso!");
  }

  async function deleteAppointment() {
    if (!editingId) return;

    const confirmed = confirm(
      "Deseja realmente excluir este agendamento?"
    );

    if (!confirmed) return;

    const result = await supabaseClient
      .from("agendamentos")
      .delete()
      .eq("id", editingId);

    if (result.error) {
      alert("Erro ao excluir: " + result.error.message);
      return;
    }

    editingId = null;
    closeModal();
    await loadAppointments();
  }

  function changeDay(amount) {
    const input = document.getElementById("datePicker");
    const value = input.value || today();

    const parts = value.split("-");
    const date = new Date(
      Number(parts[0]),
      Number(parts[1]) - 1,
      Number(parts[2])
    );

    date.setDate(date.getDate() + amount);

    input.value =
      date.getFullYear() +
      "-" +
      pad(date.getMonth() + 1) +
      "-" +
      pad(date.getDate());

    loadAppointments();
  }

  function goToday() {
    document.getElementById("datePicker").value = today();
    loadAppointments();
  }

  document.getElementById("datePicker").value = today();

  render();

  if (SUPABASE_KEY !== "COLE_AQUI_SUA_CHAVE_PUBLICA") {
    loadAppointments();
  } else {
    showMessage(
      "Falta configurar a chave pública do Supabase.",
      true
    );
  }
</script>

</body>
</html>
