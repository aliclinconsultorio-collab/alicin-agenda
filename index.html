<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda AliClin</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f8;
      color: #263238;
    }

    header {
      background: white;
      padding: 20px 28px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 5px 0 0;
      color: #667;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      background: #167c80;
      color: white;
      font-weight: bold;
    }

    button.secondary {
      background: white;
      color: #333;
      border: 1px solid #ccc;
    }

    .toolbar {
      padding: 18px 28px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    input, select, textarea {
      padding: 9px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 14px;
    }

    .grid {
      margin: 0 28px 30px;
      background: white;
      overflow-x: auto;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #fafafa;
    }

    td.time {
      width: 100px;
      font-weight: bold;
    }

    td.cell {
      height: 52px;
      cursor: pointer;
    }

    td.cell:hover {
      background: #eef8f8;
    }

    .empty {
      color: #aaa;
    }

    .appointment {
      background: #dff3f2;
      border-radius: 6px;
      padding: 7px;
    }

    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: white;
      width: min(560px, 92vw);
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 10px;
      padding: 22px;
    }

    .modal h2 {
      margin-top: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    @media (max-width: 650px) {
      header {
        align-items: flex-start;
        gap: 12px;
        flex-direction: column;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>AliClin</h1>
    <p>Agenda compartilhada da clínica</p>
  </div>

  <button type="button" onclick="openNew()">+ Novo agendamento</button>
</header>

<div class="toolbar">
  <button type="button" class="secondary" onclick="changeDay(-1)">← Dia anterior</button>
  <button type="button" class="secondary" onclick="goToday()">Hoje</button>
  <button type="button" class="secondary" onclick="changeDay(1)">Dia seguinte →</button>

  <input id="datePicker" type="date" onchange="render()">

  <select id="filterRoom" onchange="render()">
    <option value="">Todas as salas</option>
    <option value="Consultório 1">Consultório 1</option>
    <option value="Consultório 2">Consultório 2</option>
    <option value="Consultório 3">Consultório 3</option>
  </select>
</div>

<div class="grid">
  <table>
    <thead>
      <tr>
        <th>Horário</th>
        <th>Consultório 1</th>
        <th>Consultório 2</th>
        <th>Consultório 3</th>
      </tr>
    </thead>
    <tbody id="body"></tbody>
  </table>
</div>

<div id="modalBg" class="modal-bg">
  <div class="modal">
    <h2>Novo agendamento</h2>

    <div class="form-grid">
      <div class="field full">
        <label>Paciente</label>
        <input id="patient" type="text">
      </div>

      <div class="field">
        <label>Telefone</label>
        <input id="phone" type="text">
      </div>

      <div class="field">
        <label>Profissional</label>
        <input id="professional" type="text">
      </div>

      <div class="field">
        <label>Consultório</label>
        <select id="room">
          <option value="Consultório 1">Consultório 1</option>
          <option value="Consultório 2">Consultório 2</option>
          <option value="Consultório 3">Consultório 3</option>
        </select>
      </div>

      <div class="field">
        <label>Data</label>
        <input id="appointmentDate" type="date">
      </div>

      <div class="field">
        <label>Início</label>
        <input id="start" type="time">
      </div>

      <div class="field">
        <label>Fim</label>
        <input id="end" type="time">
      </div>

      <div class="field full">
        <label>Observações</label>
        <textarea id="notes" rows="3"></textarea>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="secondary" onclick="closeModal()">Cancelar</button>
      <button type="button" onclick="saveAppointment()">Salvar</button>
    </div>
  </div>
</div>

<script>
  const rooms = ["Consultório 1", "Consultório 2", "Consultório 3"];
  let appointments = [];

  function pad(number) {
    return String(number).padStart(2, "0");
  }

  function today() {
    const now = new Date();
    return now.getFullYear() + "-" +
      pad(now.getMonth() + 1) + "-" +
      pad(now.getDate());
  }

  function times() {
    const list = [];

    for (let hour = 8; hour <= 19; hour++) {
      list.push(pad(hour) + ":00");

      if (hour < 19) {
        list.push(pad(hour) + ":30");
      }
    }

    return list;
  }

  function render() {
    const selectedDate = document.getElementById("datePicker").value || today();
    const roomFilter = document.getElementById("filterRoom").value;
    const body = document.getElementById("body");

    document.getElementById("datePicker").value = selectedDate;
    body.innerHTML = "";

    times().forEach(function(time) {
      const row = document.createElement("tr");

      const timeCell = document.createElement("td");
      timeCell.className = "time";
      timeCell.textContent = time;
      row.appendChild(timeCell);

      rooms.forEach(function(room) {
        const cell = document.createElement("td");
        cell.className = "cell";

        if (roomFilter && roomFilter !== room) {
          cell.style.opacity = "0.25";
        } else {
          const appointment = appointments.find(function(item) {
            return item.date === selectedDate &&
              item.room === room &&
              item.start === time;
          });

          if (appointment) {
            cell.innerHTML =
              '<div class="appointment"><strong>' +
              escapeHtml(appointment.patient) +
              "</strong><br>" +
              escapeHtml(appointment.professional) +
              "</div>";
          } else {
            cell.innerHTML = '<div class="empty">Livre</div>';

            cell.onclick = function() {
              openNew(selectedDate, room, time);
            };
          }
        }

        row.appendChild(cell);
      });

      body.appendChild(row);
    });
  }

  function openNew(date, room, startTime) {
    document.getElementById("patient").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("professional").value = "";
    document.getElementById("notes").value = "";

    document.getElementById("appointmentDate").value =
      date || document.getElementById("datePicker").value || today();

    document.getElementById("room").value = room || "Consultório 1";

    if (startTime) {
      document.getElementById("start").value = startTime;

      const parts = startTime.split(":");
      let hour = Number(parts[0]);
      let minute = Number(parts[1]) + 30;

      if (minute >= 60) {
        hour = hour + 1;
        minute = minute - 60;
      }

      document.getElementById("end").value =
        pad(hour) + ":" + pad(minute);
    } else {
      document.getElementById("start").value = "";
      document.getElementById("end").value = "";
    }

    document.getElementById("modalBg").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("modalBg").style.display = "none";
  }

  async function saveAppointment() {
  const patient = document.getElementById("patient").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const professional = document.getElementById("professional").value.trim();
  const room = document.getElementById("room").value;
  const date = document.getElementById("appointmentDate").value;
  const start = document.getElementById("start").value;
  const end = document.getElementById("end").value;
  const notes = document.getElementById("notes").value.trim();

  if (!patient || !date || !start || !end) {
    alert("Preencha paciente, data, horário inicial e horário final.");
    return;
  }

  const { data, error } = await supabaseClient
    .from("agendamentos")
    .insert([{
      paciente: patient,
      telefone: phone,
      profissional: professional,
      sala: room,
      dados: date,
      horario_inicial: start,
      horario_final: end,
      observacao: notes
    }])
    .select();

  if (error) {
    alert("Erro ao salvar: " + error.message);
    return;
  }

  appointments.push({
    patient: patient,
    phone: phone,
    professional: professional,
    room: room,
    date: date,
    start: start,
    end: end,
    notes: notes
  });

  document.getElementById("datePicker").value = date;
  closeModal();
  render();
  alert("Agendamento salvo com sucesso!");
}

    alert("Agendamento salvo com sucesso!");
  }

  function changeDay(amount) {
    const input = document.getElementById("datePicker");
    const parts = (input.value || today()).split("-");

    const date = new Date(
      Number(parts[0]),
      Number(parts[1]) - 1,
      Number(parts[2])
    );

    date.setDate(date.getDate() + amount);

    input.value =
      date.getFullYear() + "-" +
      pad(date.getMonth() + 1) + "-" +
      pad(date.getDate());

    render();
  }

  function goToday() {
    document.getElementById("datePicker").value = today();
    render();
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text || "";
    return div.innerHTML;
  }

  document.getElementById("datePicker").value = today();
  render();
</script>

</body>
</html>
